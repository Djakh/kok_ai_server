[project]
name = "kok-ai-server"
version = "1.3.0"
description = "KOK.AI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "geoalchemy2==0.17.1",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "argon2-cffi==25.1.0",
  "PyJWT==2.10.1",
  "redis==6.4.0",
  "celery==5.5.3",
  "boto3==1.40.28",
  "python-dateutil==2.9.0.post0",
  "orjson==3.11.3",
  "httpx==0.28.1",
  "email-validator==2.3.0",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.12.10",
  "mypy==1.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
markers = ["live_provider: opt-in test that consumes real provider quota"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP017", "UP042"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
