# Include this file inside the `server {}` block that serves api.kokai.uz.
# 48 MiB is intentionally above the API's 40,000,000-byte image budget plus
# multipart overhead. FastAPI remains the authoritative validator.
client_max_body_size 48m;
client_body_timeout 60s;

# Return the same JSON envelope shape as the API if Nginx rejects a body before
# proxying it. The application cannot add its request ID because it never sees
# this request.
error_page 413 = @kok_request_too_large;

location @kok_request_too_large {
    default_type application/json;
    return 413 '{"success":false,"data":null,"error":{"code":"upload_too_large","message":"The request exceeds the reverse-proxy upload limit.","request_id":null,"details":{"max_request_bytes":50331648}},"meta":null}';
}
